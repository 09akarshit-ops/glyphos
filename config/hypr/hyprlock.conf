input-field {
    size = 312, 48
    rounding = 12
    outline_thickness = 1
    outer_color = rgba(170, 170, 163, 1.0)
    inner_color = rgba(255, 255, 255, 0.65)
    font_color = rgba(17, 17, 17, 1.0)
    font_family = Sans
    placeholder_text = Enter password
    fade_on_empty = false
    dots_size = 0.2
    dots_spacing = 0.25
    position = 0, -265
    halign = center
    valign = center
    zindex = 3
}


# Recovery overlay rendered inside the lock surface; click again to dismiss.
label {
    text = cmd[update:0:1] ~/.config/hypr/scripts/lock-ui.py recovery-text
