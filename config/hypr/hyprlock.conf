# GlyphOS lock screen — hyprlock v0.9.6
# Center-relative card offsets; positive Y points upward.
# Profile selection is visual; PAM uses the current account.

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    path = ~/Pictures/wallpaper.jpg
    reload_time = 5
    blur_passes = 2
    blur_size = 4
    brightness = 1.0
    contrast = 1.0
    vibrancy = 0.0
    noise = 0.0
    color = rgba(233, 233, 228, 1.0)
}



label {
    text = cmd[update:60000] ~/.config/hypr/scripts/get-weather.sh
    font_family = Sans
    font_size = 19
    color = rgba(85, 85, 85, 1.0)
    position = 56, -48
    halign = left
    valign = top
}

label {
    text = cmd[update:1000] date +'%I:%M %p'
    font_family = Ndot 55
    font_size = 48
    color = rgba(17, 17, 17, 1.0)
    position = 0, -48
    halign = center
    valign = top
}

label {
    text = cmd[update:60000] LC_ALL=C date +'%a %d %b' | tr '[:lower:]' '[:upper:]'
    font_family = Ndot 55
    font_size = 24
    color = rgba(85, 85, 85, 1.0)
    position = 0, -126
    halign = center
    valign = top
}

