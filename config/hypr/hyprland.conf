# GlyphOS - Base Hyprland Config

monitor=,preferred,auto,1

exec-once = ~/.config/hypr/scripts/lock-layout.py

input {
    kb_layout = us
    sensitivity = 0
    accel_profile = flat
    force_no_accel = false
    follow_mouse = 0
    mouse_refocus = true
}

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(e9e9e4ff)
    col.inactive_border = rgba(00000000)
    layout = dwindle
}

decoration {
    rounding = 12
}

$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, exec, ~/.config/eww/scripts/window-management.py close active
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, ~/.config/glyphos/scripts/glyph_explorer.py
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, F, exec, ~/.config/eww/scripts/window-management.py maximize active
bind = , PRINT, exec, grim -g "$(slurp)" - | tee >(wl-copy) > ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png   
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
exec-once = ~/.config/eww/scripts/set-wallpaper.sh
exec-once = ~/.config/eww/scripts/start-desktop.sh
bind = SUPER, N, exec, eww --no-daemonize open control-center
bind = SUPER, L, exec, ~/.config/hypr/scripts/lock-layout.py
bind = $mainMod, S, exec, ~/.config/eww/scripts/window-management.py minimize active
bind = $mainMod SHIFT, S, togglespecialworkspace, minimized
bind = SUPER, I, exec, eww --no-daemonize open settings-app
bindr = SUPER, SUPER_L, exec, eww --no-daemonize open --toggle app-launcher
bind = SUPER, Escape, exec, ~/.config/eww/scripts/modal.py close
# Pass left clicks through while dismissing a taskbar menu outside its bounds.
bindn = , mouse:272, exec, ~/.config/eww/scripts/app-service.py dismiss-context
bind = SUPER, P, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
# Wallpaper is started by eww/scripts/start-desktop.sh with an explicit hyprpaper config.
exec-once = hypridle
exec-once = mako

animations {
    enabled = true
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    animation = windows, 1, 4, smoothIn
    animation = windowsOut, 1, 4, smoothOut
    animation = border, 1, 6, default
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 4, smoothIn
}



decoration {
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000030)
    }
}



decoration {
    blur {
        enabled = true
        size = 6
        passes = 3
    }
}

# GlyphOS overlay animation and transparent dismissal surface.
layerrule = animation slide right, match:namespace ^control-center$
layerrule = blur on, match:namespace ^control-center$
layerrule = no_anim on, match:namespace ^modal-dismiss$
animation = layers, 1, 4, smoothIn, slide

# Keep transparent rounded corners clear of layer blur.
layerrule = ignore_alpha 0.25, match:namespace ^control-center$

# Default sizing for every new application (Hyprland 0.56 rule syntax).
# These static launch rules allow manual restore, resize, and floating changes.
windowrule = match:class .*, float on
windowrule = match:class .*, maximize on
bind = SUPER, D, exec, ~/.config/eww/scripts/window-management.py desktop
animation = specialWorkspace, 1, 3, smoothIn, slidefadevert 35%
animation = windowsOut, 1, 3, smoothOut, popin 30%
layerrule = no_anim on, match:namespace ^glyphos-app-titlebar$

# Stable reservation order keeps the taskbar flush to y=0 across Eww reloads.
layerrule = order 100, match:namespace ^glyphos-top-bar$
layerrule = order 90, match:namespace ^glyphos-app-titlebar$
layerrule = no_anim on, match:namespace ^glyphos-top-bar$

# GlyphOS shared window controls: reserve the header below the status bar.
# CSD hints apply to newly launched clients that support them.
env = GTK_CSD,0
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# GlyphOS non-grabbing utilities and decoupled session services.
bind = CTRL SHIFT, P, exec, ~/.config/glyphos/scripts/actions.py palette
bind = CTRL SHIFT, Z, exec, ~/.config/glyphos/scripts/actions.py undo
bind = SUPER SHIFT, V, exec, ~/.config/glyphos/scripts/actions.py clipboard
bindn = , Escape, exec, ~/.config/eww/scripts/modal.py close
bindn = , mouse:272, exec, ~/.config/glyphos/scripts/actions.py dismiss
exec-once = ~/.config/glyphos/scripts/start-services.sh
windowrule = match:class ^glyph-terminal$, workspace special:glyph-terminal silent
windowrule = match:class ^rofi$, maximize off
layerrule = no_anim on, match:namespace ^glyphos-(wifi|bluetooth|notifications|dynamic-island|app-details)$

source = ~/.config/glyphos/window-memory.conf
# A normal GTK palette uses on-focus dismissal rather than a layer-shell grab.
windowrule = match:class ^glyphos-palette$, maximize off
windowrule = match:title ^GlyphOS Palette$, maximize off
source = ~/.config/glyphos/themes/hyprland.conf

# Switch without spawning a window switcher or grabbing desktop input.
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev

# Live lyric timing: negative offsets delay; these never seek the media player.
bind = SUPER CTRL, Left, exec, python3 ~/.config/glyphos/scripts/lyrics-timing.py earlier
bind = SUPER CTRL, Right, exec, python3 ~/.config/glyphos/scripts/lyrics-timing.py later
bind = SUPER CTRL, BackSpace, exec, python3 ~/.config/glyphos/scripts/lyrics-timing.py reset

# Interactive volume OSD; repeat volume steps and track mute press/release.
binde = , XF86AudioRaiseVolume, exec, ~/.config/glyphos/scripts/volume_osd.sh raise
binde = , XF86AudioLowerVolume, exec, ~/.config/glyphos/scripts/volume_osd.sh lower
bind = , XF86AudioMute, exec, ~/.config/glyphos/scripts/volume_osd.sh mute-press
bindr = , XF86AudioMute, exec, ~/.config/glyphos/scripts/volume_osd.sh mute-release

# Native Super+drag plus non-consuming drag lifecycle signals.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindnt = , mouse:272, exec, ~/.config/glyphos/scripts/snap_engine.py begin
bindnt = SUPER, mouse:272, exec, ~/.config/glyphos/scripts/snap_engine.py begin-super
bindrint = , mouse:272, exec, ~/.config/glyphos/scripts/snap_engine.py release
bind = SUPER, Escape, exec, ~/.config/glyphos/scripts/snap_engine.py cancel
layerrule = blur on, match:namespace ^glyphos-snap-(picker|preview)$
layerrule = ignore_alpha 0.1, match:namespace ^glyphos-snap-(picker|preview)$

# GlyphOS Files has its own native draggable header and rounded glass window.
windowrule = match:class ^org.glyphos.Files$, maximize off
windowrule = match:class ^org.glyphos.Files$, border_size 1
windowrule = match:class ^org.glyphos.Files$, rounding 12
windowrule = match:class ^org.glyphos.Files$, no_blur off

# Compositor blur for translucent Island and volume layers.
layerrule = blur on, match:namespace ^glyphos-(top-bar|dynamic-island|volume-osd)$
layerrule = ignore_alpha 0.1, match:namespace ^glyphos-(top-bar|dynamic-island|volume-osd)$

# Glass Control Center layers.
layerrule = blur on, match:namespace ^glyphos-settings(-app(-max)?)?$
layerrule = ignore_alpha 0.1, match:namespace ^glyphos-settings(-app(-max)?)?$

# Prefer portal-based chooser dialogs in GTK/Qt applications.
env = GTK_USE_PORTAL,1
env = QT_QPA_PLATFORMTHEME,xdgdesktopportal
