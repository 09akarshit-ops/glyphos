# Nothing OS - Base Hyprland Config

monitor=,preferred,auto,1

exec-once = waybar

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(000000ff)
    col.inactive_border = rgba(00000044)
    layout = dwindle
}

decoration {
    rounding = 12
}

$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, F, fullscreen,
bind = , PRINT, exec, grim -g "$(slurp)" - | tee >(wl-copy) > ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png   
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
exec-once = eww daemon && sleep 1 && eww open dock && eww open nowplaying && eww open sys-resources && eww open weather
bind = SUPER, N, exec, eww open control-center
bind = SUPER, N, exec, eww open control-center
bind = SUPER, L, exec, hyprlock
bind = $mainMod, S, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, S, togglespecialworkspace, minimized
bind = SUPER, I, exec, eww open settings-app
bindr = SUPER, SUPER_L, exec, eww open --toggle app-launcher
bind = SUPER, D, exec, hyprctl clients -j | jq -r ".[] | select(.workspace.name==\"$(hyprctl activeworkspace -j | jq -r .name)\") | .address" | xargs -I{} hyprctl dispatch movetoworkspacesilent special:desktop,address:{}
bind = SUPER SHIFT, D, togglespecialworkspace, desktop
bind = SUPER, D, exec, hyprctl clients -j | jq -r ".[] | select(.workspace.name==\"$(hyprctl activeworkspace -j | jq -r .name)\") | .address" | xargs -I{} hyprctl dispatch movetoworkspacesilent special:desktop,address:{}
bind = SUPER SHIFT, D, togglespecialworkspace, desktop
bind = SUPER, Escape, exec, eww close app-launcher
bind = SUPER, P, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
exec-once = ~/.config/hypr/scripts/set-wallpaper.sh
exec-once = hypridle
exec-once = mako

animations {
    enabled = true
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    animation = windows, 1, 4, smoothIn
    animation = windowsOut, 1, 4, smoothOut
    animation = border, 1, 6, default
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 4, smoothIn
}
